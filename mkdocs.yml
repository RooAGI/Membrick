site_name: Membrick
site_description: Membrick is open-source agent memory for Claude Code, Codex, and Gemini CLI. Retrieve current evidence, track superseded decisions, and preserve history.
site_url: https://rooagi.github.io/Membrick/
repo_url: https://github.com/RooAGI/Membrick
repo_name: RooAGI/Membrick
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  favicon: assets/rooagi-logo.png
  logo: assets/rooagi-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Command line: cli.md
      - MCP memory server: mcp-memory-server.md
      - HTTP server: server.md
      - Docker: docker.md
      - Python: python.md
      - Node.js: node.md
      - Rust: memory-client-rust.md
  - Integration:
      - Overview: connect-agent.md
      - Connect your AI agents:
          - Codex: codex.md
          - Claude Code: claude-code.md
          - Gemini CLI: gemini-cli.md
          - Antigravity CLI: agy.md
          - Muse Code: muse-code.md
          - OpenClaw: openclaw.md
          - Hermes: hermes.md
          - RooAGI AgentFlow: roo-runtime.md
          - Other agent frameworks: agent-frameworks.md
  - API reference:
      - Overview: api/http-overview.md
      - Memories:
          - Concepts and SDKs: api/index.md
          - Add memories: api/add.md
          - Search memories: api/search.md
          - Get a memory: api/get.md
          - List memories: api/list.md
          - Update a memory: api/update.md
          - Delete a memory: api/delete.md
          - Refresh the search view: api/refresh.md
      - Mem0-style Python adapter: mem0-compat.md
      - Provider memory:
          - Overview: api/provider/index.md
          - Add a batch: api/provider/add-batch.md
          - Search: api/provider/search.md
          - Submit a transcript capture: api/provider/captures.md
      - Boards and flows:
          - Boards: api/boards/index.md
          - Flows: api/flows/index.md
      - Dashboard telemetry:
          - Overview: api/dashboard/index.md
          - Status: api/dashboard/status.md
          - Timeseries: api/dashboard/timeseries.md
          - Metrics (JSON): api/dashboard/metrics.md
          - Integrations: api/dashboard/integrations.md
          - List sessions: api/dashboard/sessions.md
          - Session events: api/dashboard/session-events.md
          - Recent events: api/dashboard/events.md
          - Search reviews: api/dashboard/search-reviews.md
          - Capture status: api/dashboard/captures.md
      - Operations:
          - Overview: api/operations/index.md
          - Health check: api/operations/health.md
          - Prometheus metrics: api/operations/metrics.md
  - Learn:
      - Languages:
          - Chinese: language-support.md
          - Korean: korean.md
          - Spanish: spanish-support.md
      - Memory concepts:
          - How Membrick remembers: agent-memory.md
          - Stale Agent Memory: stale-memory.md
          - Session Recording: session-recording-design.md
          - Semantic supersession: semantic-supersession.md
          - Claim contract: claim-contract.md
      - Architecture:
          - Memory client: memory-client-architecture.md
          - Search guide: search.md
          - Local IPC transport: local-ipc-architecture.md
          - Ingestion architecture: ingestion-architecture.md
          - How indexing works: tier0-ingestion.md
          - MemoryService API: memory-service-api.md
          - Index concurrency: index-concurrency.md
          - Distributed query architecture: distributed-query-architecture.md
      - Observability:
          - Dashboard: observability.md
          - Prometheus: prometheus.md
          - Telemetry details: telemetry.md
      - Performance:
          - Overview and results: performance.md
          - Agent performance:
              - Codex: codex-performance-tests.md
              - Claude Code: claude-code-performance-tests.md
              - Antigravity CLI: agy-performance-tests.md
              - Agent integration methodology: benchmark-integration.md
          - Retrieval and server benchmarks:
              - Retrieval benchmark guide: benchmark.md
              - Retrieval and corpus results: benchmark-results.md
              - HTTP server benchmarks: http-server-benchmarks.md
              - LongMemEval strategies: longmemeval-strategies.md
              - Cross-system comparison: comparison.md
  - Releases:
      - Unreleased: releases/unreleased.md
      - 0.8.1: releases/0.8.1.md
      - 0.8.0: releases/0.8.0.md
      - 0.7.3: releases/0.7.3.md
      - 0.7.2: releases/0.7.2.md
      - 0.7.1: releases/0.7.1.md
      - 0.7.0: releases/0.7.0.md
      - 0.6.3: releases/0.6.3.md
      - 0.6.2: releases/0.6.2.md
      - 0.6.1: releases/0.6.1.md
      - 0.6.0: releases/0.6.0.md
      - 0.5.0: releases/0.5.0.md
      - 0.4.0: releases/0.4.0.md
      - Python migration: python-migration-0.3.0.md
      - 0.3.0: releases/0.3.0.md
      - Tantivy upgrade verification: releases/tantivy-0.26.2-verification.md
      - 0.2.1: releases/0.2.1.md
      - 0.2.0: releases/0.2.0.md
      - 0.1.9: releases/0.1.9.md
      - 0.1.8: releases/0.1.8.md
      - 0.1.7: releases/0.1.7.md
      - 0.1.6: releases/0.1.6.md
      - 0.1.5: releases/0.1.5.md
      - 0.1.4: releases/0.1.4.md
      - 0.1.3: releases/0.1.3.md
      - 0.1.2: releases/0.1.2.md
  - Contact: contact.md

exclude_docs: |
  extensions/**
  api/extensions/**
  security-review-2026-10-11.md
  show-concepts.md
  show-headings.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/dashboard-slideshow.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/dashboard-slideshow.js
  - javascripts/api-reference.js

extra:
  generator: false
  analytics_id: !ENV [GOOGLE_ANALYTICS_ID, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RooAGI/Membrick
      name: Membrick on GitHub

copyright: Apache-2.0 licensed · Built by <a href="https://www.rooagi.com">RooAGI</a>
