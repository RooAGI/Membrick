name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v0.8.0
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Match release tag to Python package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG#v}" = "$package_version"

  build-wheels:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM runner: cross-compiling this leg in maturin-action's
          # Docker image fails in ring's build (the cross assembler is
          # invoked without -march=armv8-a, so __ARM_ARCH is undefined and
          # ring's pregenerated ARM assembly does not compile). Building
          # natively on ARM avoids the cross toolchain entirely.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build agent-capable CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" && "${{ runner.arch }}" != "ARM64" ]]; then
            cargo install cross --locked
            cross build --release --bin membrick --features agent-integrations --target "${{ matrix.target }}"
          else
            cargo build --release --bin membrick --features agent-integrations --target "${{ matrix.target }}"
          fi
      - name: Stage CLI in wheel scripts
        shell: bash
        run: |
          mkdir -p membrick.data/scripts
          printf '%s\n' pip > membrick.data/scripts/membrick-install-method
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/membrick.exe" membrick.data/scripts/membrick.exe
          else
            cp "target/${{ matrix.target }}/release/membrick" membrick.data/scripts/membrick
            chmod 755 membrick.data/scripts/membrick
          fi
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: v1.9.4
          args: --release --compatibility pypi --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the CLI is in the wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert any(".data/scripts/membrick" in name for name in names), "wheel is missing the Membrick CLI script"
          assert any(".data/scripts/membrick-install-method" in name for name in names), "wheel is missing install metadata"
          PY
      - name: Verify project mode starts the bundled resident without PATH
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          test_root="$RUNNER_TEMP/membrick-wheel-smoke"
          venv="$RUNNER_TEMP/membrick-wheel-venv"
          mkdir -p "$test_root/project"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-deps dist/*.whl
          env PATH=/usr/bin:/bin "$venv/bin/python" - "$test_root/project" <<'PY'
          import sys
          import time
          from pathlib import Path
          import membrick

          root = Path(sys.argv[1])
          client = membrick.Memory.init(path=str(root))
          settings = root / ".membrick" / "server.toml"
          lines = settings.read_text().splitlines()
          lines = [line for line in lines if not line.lstrip().startswith("resident_idle_timeout_seconds")]
          settings.write_text("resident_idle_timeout_seconds = 5\n" + "\n".join(lines) + "\n")
          log = root / ".membrick" / "runtime" / "resident.log"

          def add(request_id, content):
              receipt = client.add(
                  [{"role": "user", "content": content}],
                  user_id="wheel-smoke-user",
                  request_id=request_id,
              )
              assert receipt["request_id"] == request_id
              assert receipt["user_id"] == "wheel-smoke-user"

          def wait_for_shutdowns(expected):
              deadline = time.monotonic() + 45
              contents = ""
              while time.monotonic() < deadline:
                  try:
                      contents = log.read_text()
                  except FileNotFoundError:
                      pass
                  if contents.count("shutdown complete; pending writes flushed") >= expected:
                      return contents
                  time.sleep(0.05)
              raise AssertionError(f"resident did not shut down {expected} times: {contents}")

          add("wheel-resident-before-idle", "First write starts the bundled resident.")
          first_log = wait_for_shutdowns(1)
          assert "resident idle timeout elapsed; shutting down" in first_log
          add("wheel-resident-after-idle", "Second write restarts the bundled resident.")
          final_log = wait_for_shutdowns(2)
          assert final_log.count("Membrick resident IPC listening") >= 2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v1.9.4
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/membrick
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
