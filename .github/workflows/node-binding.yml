name: Node binding

on:
  pull_request:
    paths:
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-binding.yml"
      - ".github/workflows/node-publish.yml"
  push:
    branches: [main]
    paths:
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-binding.yml"
      - ".github/workflows/node-publish.yml"

permissions:
  contents: read

jobs:
  native-build:
    # PR and main-branch checks validate one native target. The publish
    # workflow builds all supported targets for release artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node build dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Build native binding
        working-directory: bindings/node
        run: npx napi build --platform --release --target x86_64-unknown-linux-gnu
      - name: Run Node tests
        working-directory: bindings/node
        run: npm test
