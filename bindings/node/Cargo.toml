[package]
name = "membrick-node"
version = "0.8.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
membrick = { path = "../..", default-features = false, features = ["heuristic-query-semantics"] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.6"
