[package]
name = "membrick-wasm-extension-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Process-backed bounded Wasm extension execution for Membrick"

[lib]
path = "src/wasm_extension_runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "extra-checks"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
wat = "1"

[[bin]]
name = "membrick-extension-worker"
path = "src/bin/worker.rs"
